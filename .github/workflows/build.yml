name: build
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Test
        run: ./gradlew :coords:test :cot:test :missions:test :mesh:testDebugUnitTest :security:testDebugUnitTest :symbology:testDebugUnitTest :map:testDebugUnitTest :app:testDebugUnitTest --console=plain
      - name: Build APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --console=plain
      - uses: actions/upload-artifact@v4
        with: { name: p-quest-apk, path: app/build/outputs/apk/*/*.apk }
